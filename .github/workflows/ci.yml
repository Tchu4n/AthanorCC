# Verificação automática a cada push e pull request: lint, tipos, dados do lore e testes unitários.
# Os e2e (Playwright) ficam de fora por enquanto: precisam do Chromium e levam ~5 min; rodar com `npm run test:e2e`.
name: CI

on:
  push:
  pull_request:

# só leitura do repositório: o workflow não publica nem altera nada
permissions:
  contents: read

# um push novo na mesma branch cancela a verificação anterior, que ficou desatualizada
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+: o validate:data roda .ts direto no Node, sem compilar (ver README)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm test
